name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run TypeScript build
        run: bun run ts:build

      - name: Type-check tests
        run: |
          bunx tsc -p packages/sdk/tsconfig.test.json --noEmit
          bunx tsc -p packages/standalone-server/tsconfig.test.json --noEmit

      - name: Run tests
        run: bun run test

      # Replays committed LLM snapshots — no provider key, no network calls.
      # Guards the full client → REST → standalone-server → agent path, which
      # the default run only smoke-tests.
      - name: Run demo e2e (snapshot replay)
        run: LIVE_TESTS=1 bun test packages/demo/tests/app-builder.e2e.test.ts

      - name: Run release tooling tests
        run: bun run test:release
