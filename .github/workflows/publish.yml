name: Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ancestry
        run: git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version
        id: versions
        uses: ./.github/actions/extract-version
        with:
          version: ${{ github.ref }}

      - name: Lint
        run: bun run lint

      - name: TypeScript build
        run: bun run ts:build

      - name: Type-check tests
        run: |
          bunx tsc -p packages/sdk/tsconfig.test.json --noEmit
          bunx tsc -p packages/standalone-server/tsconfig.test.json --noEmit

      - name: Run tests
        run: bun run test

      - name: Run release tooling tests
        run: bun run test:release

      - name: Prepare package manifests
        run: node ./scripts/npm-publish/prepare-packages.mjs "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Pack and validate published artifacts
        run: node ./scripts/npm-publish/pack-and-validate.mjs

      - name: Publish NPM
        run: bash ./scripts/npm-publish/run.sh
        env:
          NPM_TAG: ${{ steps.versions.outputs.npmTag }}
